name: AiCat
options:
  bundleIdPrefix: com.brilliantcat
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"

settings:
  base:
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    CODE_SIGNING_ALLOWED: "NO"
    CODE_SIGN_IDENTITY: ""
    CODE_SIGNING_REQUIRED: "NO"

packages:
  StableDiffusion:
    url: https://github.com/apple/ml-stable-diffusion
    exactVersion: 1.1.1

targets:
  AiCat:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: AiCat/Sources
      - path: Assets/Assets.xcassets
      - path: Assets/CatModel
        type: folder
        buildPhase: resources
      - path: Assets/Speech
        type: folder
        buildPhase: resources
      - path: Assets/LivingRoom
        type: folder
        buildPhase: resources
      - path: AiCat-Visuals
        type: folder
        buildPhase: resources
      - path: AiCat-Animation
        type: folder
        buildPhase: resources
    dependencies:
      - framework: Frameworks/whisper.xcframework
        embed: true
        codeSign: false
      - framework: Frameworks/llama.xcframework
        embed: true
        codeSign: false
      - package: StableDiffusion
        product: StableDiffusion
      - target: AiCatWidget
        embed: true
    entitlements:
      path: AiCat/AiCat.entitlements
      properties:
        com.apple.security.application-groups: [group.com.brilliantcat.aicat]
    info:
      path: AiCat/Info.plist
      properties:
        CFBundleDisplayName: "AiCat"
        CFBundleIdentifier: "com.brilliantcat.aicat"
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        LSApplicationQueriesSchemes:
          - tg
          - youtube
          - whatsapp
        NSSpeechRecognitionUsageDescription: "AiCat использует речь для офлайн общения с тобой."
        NSMicrophoneUsageDescription: "AiCat слушает твои команды через микрофон офлайн."
        NSRemindersUsageDescription: "AiCat создает и читает напоминания."
        NSRemindersFullAccessUsageDescription: "AiCat создает и читает напоминания для организации твоего расписания."
        NSCalendarsUsageDescription: "AiCat управляет календарем."
        NSCalendarsFullAccessUsageDescription: "AiCat планирует события в твоем календаре."
        NSCameraUsageDescription: "AiCat использует камеру для фото и, по твоему выбору, для подсчёта отжиманий. При тренировке расстояние до лица обрабатывается на iPhone. Кадры и данные лица не сохраняются и не отправляются."
        NSPhotoLibraryUsageDescription: "AiCat редактирует фото по твоим командам."
        NSPhotoLibraryAddUsageDescription: "AiCat сохраняет созданные изображения в медиатеку Фото."
        CFBundleURLTypes:
          - CFBundleURLSchemes: [aicat]
        NSMotionUsageDescription: "AiCat считает движения во время тренировки."
        NSSupportsLiveActivities: true
    settings:
      base:
        GENERATE_INFOPLIST: "NO"
        INFOPLIST_FILE: "AiCat/Info.plist"
        PRODUCT_BUNDLE_IDENTIFIER: com.brilliantcat.aicat
        PRODUCT_NAME: AiCat
        SWIFT_OBJC_BRIDGING_HEADER: AiCat/Sources/Core/Audio/LocalTranscription.h
        EXECUTABLE_NAME: AiCat
        SKIP_INSTALL: "NO"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks"

  AiCatWidget:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: AiCatWidget
      - path: AiCat-Visuals
        type: folder
        buildPhase: resources
      - path: AiCat/Sources/App/CatSnapshot.swift
      - path: AiCat/Sources/App/AiCatAttributes.swift
      - path: AiCat/Sources/Intents/CareForCatIntent.swift
    entitlements:
      path: AiCatWidget/AiCatWidget.entitlements
      properties:
        com.apple.security.application-groups: [group.com.brilliantcat.aicat]
    info:
      path: AiCatWidget/Info.plist
      properties:
        CFBundleDisplayName: "AiCat Live Island"
        CFBundleIdentifier: "com.brilliantcat.aicat.widget"
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        NSSupportsLiveActivities: true
        NSExtension:
          NSExtensionPointIdentifier: "com.apple.widgetkit-extension"
    settings:
      base:
        GENERATE_INFOPLIST: "NO"
        INFOPLIST_FILE: "AiCatWidget/Info.plist"
        PRODUCT_BUNDLE_IDENTIFIER: com.brilliantcat.aicat.widget
        PRODUCT_NAME: AiCatWidget
        SKIP_INSTALL: "YES"
        APPLICATION_EXTENSION_API_ONLY: "YES"
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) AICAT_WIDGET"
        CODE_SIGNING_ALLOWED: "NO"
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGN_IDENTITY: ""

  AiCatTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: AiCatTests
    dependencies:
      - target: AiCat
    settings:
      base:
        GENERATE_INFOPLIST: "YES"

schemes:
  AiCat:
    build:
      targets:
        AiCat: all
    test:
      targets:
        - AiCatTests
