name: AiCat
options:
  bundleIdPrefix: com.brilliantcat
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"

settings:
  base:
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    CODE_SIGNING_ALLOWED: "NO"
    CODE_SIGN_IDENTITY: ""
    CODE_SIGNING_REQUIRED: "NO"

targets:
  AiCat:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: AiCat/Sources
      - path: Assets
    info:
      path: AiCat/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.brilliantcat.aicat
        PRODUCT_NAME: AiCat
        EXECUTABLE_NAME: AiCat
