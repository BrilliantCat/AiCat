name: AiCat
options:
  bundleIdPrefix: com.brilliantcat
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"

settings:
  base:
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    CODE_SIGNING_ALLOWED: "NO"
    CODE_SIGN_IDENTITY: ""
    CODE_SIGNING_REQUIRED: "NO"

targets:
  AiCat:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: AiCat/Sources
      - path: Assets
    info:
      path: AiCat/Info.plist
      properties:
        CFBundleDisplayName: "AiCat"
        CFBundleIdentifier: "com.brilliantcat.aicat"
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        NSSpeechRecognitionUsageDescription: "AiCat использует речь для офлайн общения с тобой."
        NSMicrophoneUsageDescription: "AiCat слушает твои команды через микрофон офлайн."
        NSRemindersUsageDescription: "AiCat создает и читает напоминания."
        NSCalendarsUsageDescription: "AiCat управляет календарем."
        NSCameraUsageDescription: "AiCat использует камеру для анализа фото."
        NSPhotoLibraryUsageDescription: "AiCat редактирует фото по твоим командам."
        NSSupportsLiveActivities: true
    settings:
      base:
        GENERATE_INFOPLIST: "NO"
        INFOPLIST_FILE: "AiCat/Info.plist"
        PRODUCT_BUNDLE_IDENTIFIER: com.brilliantcat.aicat
        PRODUCT_NAME: AiCat
        EXECUTABLE_NAME: AiCat
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
