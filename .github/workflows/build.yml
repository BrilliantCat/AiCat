name: Build AiCat iOS (.ipa)

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    name: Build IPA on Cloud macOS
    runs-on: macos-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project
        run: xcodegen generate

      - name: Fast Syntax & Compilation Check
        run: |
          set -o pipefail
          echo "=== Fast Syntax & Compilation Check ==="
          xcodebuild -project AiCat.xcodeproj -scheme AiCat -configuration Debug \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee fast_build.log || {
              echo "=== SYNTAX/TYPE ERROR DETECTED ==="
              grep -C 2 -E "(error: |BUILD FAILED)" fast_build.log || true
              grep -E "error: " fast_build.log | head -n 5 | while IFS= read -r line; do
                echo "::error::$line"
              done
              exit 65
            }

      - name: Build Xcode Archive
        run: |
          set -o pipefail
          xcodebuild -project AiCat.xcodeproj -scheme AiCat -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/AiCat.xcarchive \
            archive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_ENTITLEMENTS="" 2>&1 | tee xcode_build.log || {
              echo "=== ARCHIVE FAILED ==="
              grep -C 2 -E "(error: |BUILD FAILED)" xcode_build.log || true
              grep -E "error: " xcode_build.log | head -n 5 | while IFS= read -r line; do
                echo "::error::$line"
              done
              exit 65
            }

      - name: Upload Build Log Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcode_build_logs
          path: "*.log"
          if-no-files-found: ignore

      - name: Package Payload to IPA
        run: |
          mkdir -p build/Payload
          cp -r build/AiCat.xcarchive/Products/Applications/AiCat.app build/Payload/
          cd build
          zip -r AiCat.ipa Payload/
          ls -lh AiCat.ipa

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AiCat-iOS
          path: build/AiCat.ipa
          retention-days: 7
