name: Build AiCat iOS (.ipa)

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    name: Build IPA on Cloud macOS
    runs-on: macos-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project
        run: xcodegen generate

      - name: Fast Syntax & Compilation Check
        run: |
          set -o pipefail
          echo "=== Fast Syntax & Compilation Check ==="
          xcodebuild -project AiCat.xcodeproj -scheme AiCat -configuration Debug \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee fast_build.log || (echo "=== SYNTAX/TYPE ERROR DETECTED ===" && grep -C 3 -E "(error: |BUILD FAILED)" fast_build.log && exit 65)

      - name: Build Xcode Archive
        run: |
          set -o pipefail
          xcodebuild -project AiCat.xcodeproj -scheme AiCat -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/AiCat.xcarchive \
            archive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_ENTITLEMENTS="" 2>&1 | tee xcode_build.log

      - name: Inspect Build Failure
        if: failure()
        run: |
          echo "=== XCODEBUILD FAILED: PRINTING ERROR LINES ==="
          grep -C 5 -E "(error: |BUILD FAILED|\*\* ARCHIVE FAILED \*\*)" *.log || tail -n 150 fast_build.log
          echo "==============================================="

      - name: Upload Build Log Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcode_build_logs
          path: "*.log"
          if-no-files-found: ignore

      - name: Package Payload to IPA
        run: |
          mkdir -p build/Payload
          cp -r build/AiCat.xcarchive/Products/Applications/AiCat.app build/Payload/
          cd build
          zip -r AiCat.ipa Payload/
          ls -lh AiCat.ipa

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AiCat-iOS
          path: build/AiCat.ipa
          retention-days: 7
