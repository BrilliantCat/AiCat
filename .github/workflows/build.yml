name: Build AiCat iOS (.ipa)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build IPA on Cloud macOS
    runs-on: macos-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Show System Info
        run: |
          sw_vers
          xcodebuild -version

      - name: Prepare Build Output Directory
        run: mkdir -p build/Payload

      - name: Package Payload to .ipa
        run: |
          # Создаем базовый .ipa пакет для проверки процесса установки
          touch build/Payload/AiCat.app
          cd build && zip -r AiCat.ipa Payload/
          
      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AiCat-iOS
          path: build/AiCat.ipa
          retention-days: 7
