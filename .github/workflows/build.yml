name: Build AiCat iOS (.ipa)

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    name: Build IPA on Cloud macOS
    runs-on: macos-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Check Xcode and macOS Version
        run: |
          sw_vers
          xcodebuild -version

      - name: Prepare Payload Directory
        run: |
          mkdir -p build/Payload/AiCat.app

      - name: Package IPA
        run: |
          cd build
          zip -r AiCat.ipa Payload/
          ls -lh AiCat.ipa

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AiCat-iOS
          path: build/AiCat.ipa
          retention-days: 7
