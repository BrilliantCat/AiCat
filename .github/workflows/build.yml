name: Build AiCat iOS (.ipa)

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    name: Build IPA on Cloud macOS
    runs-on: macos-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Install pinned llama.cpp framework
        run: |
          mkdir -p Frameworks
          curl --fail --location --retry 3 https://github.com/ggml-org/llama.cpp/releases/download/b5046/llama-b5046-xcframework.zip -o /tmp/llama.zip
          unzip -q /tmp/llama.zip -d Frameworks
          if [ ! -d Frameworks/llama.xcframework ]; then
            framework=$(find Frameworks -type d -name llama.xcframework -print -quit)
            test -n "$framework"
            mv "$framework" Frameworks/llama.xcframework
          fi
          test -d Frameworks/llama.xcframework

      - name: Generate Xcode Project
        run: xcodegen generate

      - name: Cache Swift packages
        uses: actions/cache@v4
        with:
          path: SourcePackages
          key: swift-packages-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('project.yml', 'Package.swift') }}

      - name: Resolve Swift package dependencies
        timeout-minutes: 10
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4; do
            if xcodebuild -resolvePackageDependencies \
              -project AiCat.xcodeproj -scheme AiCat \
              -clonedSourcePackagesDirPath SourcePackages \
              2>&1 | tee "packages-$attempt.log"; then
              exit 0
            fi
            if [ "$attempt" -lt 4 ]; then
              echo "::warning::Package download failed (attempt $attempt of 4). Retrying."
              sleep "$((attempt * 15))"
            fi
          done
          echo "::error::Swift package download failed after 4 attempts. See packages-*.log."
          exit 1

      - name: Fast Syntax & Compilation Check
        run: |
          set -o pipefail
          echo "=== Fast Syntax & Compilation Check ==="
          xcodebuild -project AiCat.xcodeproj -scheme AiCat -configuration Debug \
            -clonedSourcePackagesDirPath SourcePackages \
            -disableAutomaticPackageResolution \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee fast_build.log || {
              echo "=== BUILD CHECK FAILED ==="
              grep -C 2 -E "(error: |BUILD FAILED)" fast_build.log || true
              grep -E "error: " fast_build.log | while IFS= read -r line; do
                echo "::error::$line"
              done
              exit 65
            }

      - name: Run unit tests
        timeout-minutes: 15
        run: |
          set -o pipefail
          simulator=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(v["udid"] for group in d["devices"].values() for v in group if v["name"].startswith("iPhone")))')
          xcodebuild -project AiCat.xcodeproj -scheme AiCat -configuration Debug \
            -clonedSourcePackagesDirPath SourcePackages \
            -disableAutomaticPackageResolution \
            -destination "platform=iOS Simulator,id=$simulator" \
            -parallel-testing-enabled NO \
            -test-timeouts-enabled YES \
            -default-test-execution-time-allowance 60 \
            -maximum-test-execution-time-allowance 120 \
            CODE_SIGNING_ALLOWED=NO test 2>&1 | tee tests.log

      - name: Build Xcode Archive
        run: |
          set -o pipefail
          xcodebuild -project AiCat.xcodeproj -scheme AiCat -configuration Release \
            -clonedSourcePackagesDirPath SourcePackages \
            -disableAutomaticPackageResolution \
            -destination 'generic/platform=iOS' \
            -archivePath build/AiCat.xcarchive \
            archive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            2>&1 | tee xcode_build.log || {
              echo "=== ARCHIVE FAILED ==="
              grep -C 2 -E "(error: |BUILD FAILED)" xcode_build.log || true
              grep -E "error: " xcode_build.log | while IFS= read -r line; do
                echo "::error::$line"
              done
              exit 65
            }

      - name: Upload Build Log Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcode_build_logs
          path: "*.log"
          if-no-files-found: ignore

      - name: Verify embedded inference framework
        run: |
          set -euo pipefail
          app="build/AiCat.xcarchive/Products/Applications/AiCat.app"
          framework="$app/Frameworks/llama.framework/llama"
          if [ ! -f "$framework" ]; then
            echo "::error::llama.framework is missing from the application archive"
            exit 1
          fi
          xcrun lipo "$framework" -verify_arch arm64
          xcrun otool -L "$app/AiCat"
          xcrun otool -L "$framework"

      - name: Package Payload to IPA
        run: |
          set -euo pipefail
          mkdir -p build/Payload
          cp -r build/AiCat.xcarchive/Products/Applications/AiCat.app build/Payload/
          app="build/Payload/AiCat.app"
          widget="$app/PlugIns/AiCatWidget.appex"
          test -f "$widget/AiCat-Visuals/widget/sleep.png"
          test -f "$widget/AiCat-Visuals/dynamic-island/peek-leading.png"
          # Carry the requested App Group in both executables for SideStore to re-sign.
          for framework in "$app"/Frameworks/*.framework "$app"/Frameworks/*.dylib; do
            if [ -e "$framework" ]; then codesign --force --sign - --timestamp=none "$framework"; fi
          done
          codesign --force --sign - --timestamp=none --entitlements AiCatWidget/AiCatWidget.entitlements "$widget"
          codesign --force --sign - --timestamp=none --entitlements AiCat/AiCat.entitlements "$app"
          for bundle in "$widget" "$app"; do
            codesign -d --entitlements - --xml "$bundle" | python3 -c 'import plistlib, sys; assert "group.com.brilliantcat.aicat" in plistlib.loads(sys.stdin.buffer.read())["com.apple.security.application-groups"]'
          done
          cd build
          test -f Payload/AiCat.app/Frameworks/llama.framework/llama
          zip -r AiCat.ipa Payload/
          unzip -tq AiCat.ipa
          unzip -l AiCat.ipa "Payload/AiCat.app/Frameworks/llama.framework/llama"
          ls -lh AiCat.ipa

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AiCat-iOS
          path: build/AiCat.ipa
          retention-days: 7
